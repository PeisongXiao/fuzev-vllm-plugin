[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzev-vllm-plugin"
dynamic = ["version"]
description = "FuZev decision scoring and generation with vLLM"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Peisong Xiao"}]
dependencies = ["fuzev-runtime>=1.0,<2", "pydantic>=2.5", "torch", "pillow>=9.1", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "typesafe-sdk>=0.6"]

[project.scripts]
fuzev-vllm = "fuzev_vllm.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fuzev_vllm*"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: opt-in check against a running engine"]
